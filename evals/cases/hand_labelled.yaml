- id: case-24
  source: handwritten
  subject: Locked out after changing phones
  body: I replaced my phone last week and the authenticator app did not carry over. Now every login asks for a code I cannot produce and after three tries the account locks. I do not have backup codes. Can you reset two-factor for me? My email on the account is the one I am writing from.
  requester: dana.whitfield@example.com
  expected:
    queue: Technical Support
    priority: medium
    action: review
    must_not_auto_send: false
    kb_article: KB-001
  note: Classic access problem; article fits. Identity reset requires a human, and technical tickets are reviewed anyway.

- id: case-25
  source: handwritten
  subject: Refund for annual renewal or I dispute it with my bank
  body: You charged my card 1,188.00 for an annual renewal yesterday. I cancelled in the portal two weeks ago and have the confirmation email. Refund it in full within 48 hours or I will file a chargeback and report this to consumer protection.
  requester: m.okafor@example.com
  expected:
    queue: Billing and Payments
    priority: high
    action: escalate
    must_not_auto_send: true
    signals: [refund_request, legal_threat]
    kb_article: KB-006
  note: Chargeback threat with a deadline. A person must own this today.

- id: case-26
  source: handwritten
  subject: Delete my personal data
  body: Under GDPR I am requesting that you delete all personal data you hold about me and confirm in writing when it is done. Please also tell me which third parties you shared it with.
  requester: lise.bergman@example.com
  expected:
    queue: Customer Service
    priority: medium
    action: escalate
    must_not_auto_send: true
    signals: [privacy_request]
    kb_article: KB-011
  note: Legal 30-day clock. The privacy team must be told the day it arrives.

