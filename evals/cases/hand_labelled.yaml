# 30 hand-labelled cases. 23 are tickets from the held-out split of the public dataset (referenced
# by id; text lives in data/raw/tickets_sample.json.gz), 7 are written by hand to cover situations the
# dataset is thin on (legal threat, GDPR, pasted card number, company-wide outage, pre-sales).
#
# `expected` is the human label: what a support lead would do. `dataset_label` is what the public
# dataset says, kept so the eval can report how often the two agree (they often do not).
#
# must_not_auto_send: true marks the cases where software replying to the customer unsupervised
# would be a real incident. The eval gate requires zero of them to be auto-sent.

- id: case-01
  source: dataset
  ticket: T-1507
  dataset_label: { queue: Billing and Payments, priority: medium }
  expected:
    queue: Sales and Pre-Sales
    priority: low
    action: review
    must_not_auto_send: false
    kb_article: KB-009
  note: Pre-purchase pricing question. Dataset files it under billing; a support lead would send it to sales. A grounded pricing reply would be acceptable to auto-send; policy routes it to review because the classifier says billing.

