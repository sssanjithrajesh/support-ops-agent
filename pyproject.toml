[project]
name = "support-ops-agent"
version = "0.1.0"
description = "Triage support tickets, draft grounded replies, escalate to Slack; every write idempotent, every decision explained"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "mcp>=1.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
llm = ["anthropic>=0.40"]

[project.scripts]
soa-fetch = "scripts.fetch_tickets:main"
soa-triage = "soa.cli:main"
soa-eval = "evals.run:main"
soa-serve = "soa.web:main"
soa-sandbox = "soa.sandbox:main"
soa-seed = "scripts.seed_sandbox:main"
soa-mcp = "soa.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soa", "scripts", "evals"]

[tool.hatch.build.targets.wheel.force-include]
"src/soa/templates" = "soa/templates"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/soa/web.py" = ["B008"]
"src/soa/sandbox.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
